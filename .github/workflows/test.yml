name: Run tests

on:
  pull_request:
    branches: [ release, main ]
  push:
    branches: [ release, main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Test lint, types, format and templates
        run: make test-lint test-format test-types test-unit
      - name: Test python package
        # twine>=7.0.0 (needed for Metadata-Version 2.5 support) requires
        # Python >=3.10, so only run this check on the newer interpreter.
        if: matrix.python-version != '3.9'
        run: |
          pip install build "twine>=7.0.0"
          make test-pythonpackage

  live-conformance-azure:
    # Safe to run on every PR, including from forks: Azurite needs zero
    # secrets, unlike a real Azure account. The rustfs backend has no
    # equivalent job here yet (see TESTING.rst) — not a gap introduced by
    # this merge, tutor-rustfs's own CI never ran one either. Real Azure
    # stays a manual, secrets-gated tier (see TESTING.rst), never wired in
    # here.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        # tests/conftest.py imports `tutor` (and is auto-loaded for every
        # test in this directory, including this file) and the autouse
        # _loaded_plugin fixture requires this package itself to be
        # installed so "objectstorage" shows up as a discoverable plugin
        # — `pip install -e ".[dev]"` covers both, matching the `tests`
        # job above. boto3/requests aren't in the dev extras (kept out so
        # a plain template-check contributor isn't forced to install
        # them), so they're added here explicitly.
        run: |
          pip install -e ".[dev]"
          pip install boto3 requests
      - name: Start Azurite and gateway services
        run: docker compose -f tests/docker-compose.ci.yml up -d azurite rclonegw rclonegw-public caddy
      - name: Wait for the gateway to accept connections
        run: |
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://localhost:8099/ && break
            sleep 1
          done
      - name: Provision Azure containers
        run: docker compose -f tests/docker-compose.ci.yml run --rm init
      - name: Run live conformance suite
        env:
          OBJSTORAGE_TEST_ENDPOINT: http://localhost:8099
          OBJSTORAGE_TEST_PUBLIC_HOST: http://localhost:8099
          OBJSTORAGE_TEST_PUBLIC_DIRECT_ENDPOINT: http://localhost:9002
          OBJSTORAGE_TEST_ACCESS_KEY: openedx
          OBJSTORAGE_TEST_SECRET_KEY: test-secret-key-for-ci-only
          OBJSTORAGE_TEST_BUCKET: openedx
          OBJSTORAGE_TEST_PRIVATE_BUCKET: openedxgrades
          # Finding 1's adversarial out-of-order multipart test used to be
          # gated behind this (it reliably hung rclone's own 256MiB default
          # buffer). Now that OBJSTORAGE_AZURE_MULTIPART_BUFFER_LIMIT raises
          # that default to 2GiB and this test passes reliably against
          # Azurite (~25s for all 5 concurrency levels at 350 MiB - see
          # EVALUATION.md Finding 1), run it on every PR: it is exactly the
          # regression guard for someone reverting that fix later.
          # multipart_server_side_copy stays opted out by default (see its
          # own skipif reason); nothing here needs to exclude it explicitly.
          OBJSTORAGE_TEST_REAL_AZURE_GATE: "1"
          # Pinned to the exact size this fix was validated against (see
          # EVALUATION.md Finding 1's test matrix). Without this the test
          # defaults to 1024 MiB per concurrency level (5 GiB total across
          # the sweep) - untested here and unnecessarily heavy for routine
          # CI.
          OBJSTORAGE_TEST_REAL_AZURE_SIZE_MIB: "350"
        run: pytest -v tests/test_s3_conformance_azure.py
      - name: Dump gateway logs on failure
        if: failure()
        run: docker compose -f tests/docker-compose.ci.yml logs
